<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 · app style</title>
  <!-- Font Awesome 6 (free) for crisp app-style icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(145deg, #f6f9fc 0%, #e9f1f8 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      /* subtle noise texture for modern app feel */
      background-image: radial-gradient(circle at 30% 40%, rgba(255,255,255,0.4) 0%, transparent 30%),
                        radial-gradient(circle at 80% 70%, rgba(255,255,255,0.5) 0%, transparent 35%),
                        linear-gradient(145deg, #f6f9fc 0%, #e9f1f8 100%);
    }

    .app-card {
      max-width: 480px;
      width: 100%;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(14px) saturate(180%);
      -webkit-backdrop-filter: blur(14px) saturate(180%);
      border-radius: 40px;
      box-shadow: 0 25px 50px -8px rgba(0, 32, 64, 0.25),
                  inset 0 1px 2px rgba(255, 255, 255, 0.8),
                  0 0 0 1px rgba(156, 188, 226, 0.3);
      padding: 2.5rem 2rem 2.8rem 2rem;
      border: 1px solid rgba(255, 255, 255, 0.5);
      transition: all 0.2s ease;
    }

    /* subtle glassmorphism tops it off */
    .app-card:hover {
      box-shadow: 0 30px 60px -8px rgba(16, 60, 100, 0.3),
                  inset 0 1px 3px rgba(255,255,255,0.9),
                  0 0 0 1px rgba(255, 255, 255, 0.7);
    }

    /* status bar / app-like header */
    .app-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 2.2rem;
    }

    .app-dot {
      width: 13px;
      height: 13px;
      border-radius: 30px;
      background-color: #f05e5e;
      box-shadow: 0 2px 6px rgba(240, 94, 94, 0.4);
    }

    .app-dot:nth-child(2) {
      background-color: #fabb3c;
      box-shadow: 0 2px 6px rgba(250, 187, 60, 0.4);
    }

    .app-dot:nth-child(3) {
      background-color: #4acf7f;
      box-shadow: 0 2px 6px rgba(74, 207, 127, 0.4);
    }

    .app-window-bar {
      margin-left: auto;
      display: flex;
      gap: 4px;
      color: rgba(70, 90, 110, 0.7);
      font-size: 0.9rem;
      background: rgba(200, 216, 235, 0.3);
      padding: 5px 12px;
      border-radius: 50px;
      backdrop-filter: blur(4px);
      border: 0.5px solid rgba(255,255,255,0.6);
    }

    .app-window-bar i {
      font-size: 0.75rem;
      margin-right: 4px;
      color: #4f7aa6;
    }

    /* main 404 graphic in app style */
    .error-graphic {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 2rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .digit {
      font-size: 5.2rem;
      line-height: 1;
      font-weight: 700;
      background: linear-gradient(155deg, #1a344d, #2b4a6e);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 2px 10px rgba(32, 80, 120, 0.2);
    }

    .glitch-icon {
      font-size: 3.6rem;
      color: #5b8ec9;
      filter: drop-shadow(0 4px 6px rgba(55, 95, 145, 0.2));
      animation: softFloat 3.5s infinite ease-in-out;
      margin: 0 0.1rem;
    }

    @keyframes softFloat {
      0% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
      100% { transform: translateY(0); }
    }

    /* typography */
    h1 {
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #1b3144;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
    }

    h1 i {
      font-size: 2rem;
      color: #3f6a9c;
      opacity: 0.8;
    }

    .message {
      font-size: 1.1rem;
      line-height: 1.5;
      color: #2d4b6e;
      text-align: center;
      margin-bottom: 2.5rem;
      background: rgba(255, 255, 255, 0.4);
      padding: 0.8rem 1.2rem;
      border-radius: 60px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,0.7);
      box-shadow: inset 0 1px 4px rgba(255,255,255,0.8);
    }

    /* app style search / action row */
    .app-actions {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 1.8rem;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(8px);
      border-radius: 48px;
      padding: 0.4rem 0.4rem 0.4rem 1.5rem;
      border: 1px solid rgba(255,255,255,0.9);
      box-shadow: 0 8px 16px -12px rgba(0,32,64,0.2), inset 0 1px 2px white;
    }

    .search-box i {
      color: #5580aa;
      font-size: 1.1rem;
    }

    .search-box input {
      border: none;
      background: transparent;
      padding: 0.9rem 0.8rem;
      font-size: 1rem;
      width: 100%;
      outline: none;
      color: #152b3c;
    }

    .search-box input::placeholder {
      color: #7a99b5;
      font-weight: 400;
      opacity: 0.7;
    }

    .search-box button {
      background: #2f577d;
      border: none;
      color: white;
      font-weight: 500;
      padding: 0.6rem 1.6rem;
      border-radius: 40px;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: 0.15s;
      border: 1px solid rgba(255,255,255,0.3);
      box-shadow: 0 6px 14px rgba(28, 65, 102, 0.3);
    }

    .search-box button:hover {
      background: #1f4465;
      transform: scale(1.02);
      box-shadow: 0 8px 18px rgba(20, 60, 100, 0.4);
    }

    .search-box button i {
      color: white;
      font-size: 0.9rem;
    }

    .nav-links {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-top: 0.3rem;
      flex-wrap: wrap;
    }

    .nav-links a {
      text-decoration: none;
      color: #2c4b6e;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(4px);
      padding: 0.5rem 1.2rem;
      border-radius: 60px;
      border: 0.5px solid rgba(255,255,255,0.9);
      transition: all 0.15s;
      font-size: 1rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }

    .nav-links a i {
      color: #3f6a9c;
      font-size: 1rem;
    }

    .nav-links a:hover {
      background: white;
      border-color: white;
      box-shadow: 0 8px 18px -8px rgba(30, 80, 130, 0.3);
      color: #143650;
      transform: translateY(-2px);
    }

    /* app style toggle / footer */
    .app-footer-note {
      margin-top: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      font-size: 0.85rem;
      color: #607e9b;
      border-top: 1px solid rgba(125, 162, 202, 0.25);
      padding-top: 1.4rem;
    }

    .app-footer-note i {
      opacity: 0.6;
      transition: opacity 0.2s;
    }

    .app-footer-note span {
      background: rgba(255,255,255,0.5);
      padding: 4px 12px;
      border-radius: 50px;
      backdrop-filter: blur(4px);
    }

    hr {
      border: none;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(120, 160, 200, 0.3), transparent);
      margin: 1rem 0 0.5rem;
    }

    /* fully responsive */
    @media (max-width: 450px) {
      .app-card { padding: 2rem 1.5rem; }
      .digit { font-size: 4rem; }
      .glitch-icon { font-size: 2.8rem; }
      h1 { font-size: 1.8rem; }
      .search-box button span { display: none; } /* keep icon only on very small */
      .search-box button i { margin: 0; }
      .nav-links a { padding: 0.4rem 1rem; }
    }
  </style>
</head>
<body>
  <div class="app-card">
    <!-- macOS / iOS style window dots + fake status -->
    <div class="app-header">
      <div class="app-dot"></div>

  <!-- subtle extra: fake app drawer indicator (optional) -->
